services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: estoque
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: ${PGPASSWORD:?Defina PGPASSWORD no .env}
    volumes:
      - estoque_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque -d estoque"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: estoque
      PGUSER: estoque
      PGPASSWORD: ${PGPASSWORD:?Defina PGPASSWORD no .env}
      APP_PASSWORD: ${APP_PASSWORD:?Defina APP_PASSWORD no .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "127.0.0.1:3001:3001"

  caddy:
    image: caddy:2-alpine
    profiles: ["production"]
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  estoque_postgres:
  caddy_data:
  caddy_config:
